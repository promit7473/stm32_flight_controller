<rect x="40" y="158" width="200" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="50" y="178" font-family="DejaVu Sans, Arial" font-size="13" font-weight="700" fill="#1a1d21">Receiver (6-channel PPM)</text><text x="50" y="196" font-family="DejaVu Sans, Arial" font-size="11" fill="#6b7280">PPM on one wire</text><text x="50" y="210" font-family="DejaVu Sans, Arial" font-size="11" fill="#6b7280">Do not connect its +5 V BEC</text>
<path d="M 240 189 L 360 189 L 360 218 L 470 218" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="250" y="182" font-family="DejaVu Sans, Arial" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">PPM</text>
<rect x="40" y="244" width="200" height="90" rx="6" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/><text x="50" y="264" font-family="DejaVu Sans, Arial" font-size="13" font-weight="700" fill="#1a1d21">I2C sensor bus  400 kHz</text><text x="50" y="282" font-family="DejaVu Sans, Arial" font-size="11" fill="#6b7280">MPU-6050  0x68  IMU</text><text x="50" y="296" font-family="DejaVu Sans, Arial" font-size="11" fill="#6b7280">HMC5883L  0x1E  compass</text><text x="50" y="310" font-family="DejaVu Sans, Arial" font-size="11" fill="#6b7280">MS5611    0x77  barometer  (3.3 V)</text>
<path d="M 240 280 L 340 280 L 340 248 L 470 248" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 240 298 L 325 298 L 325 273 L 470 273" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="250" y="274" font-family="DejaVu Sans, Arial" font-size="10" font-weight="600" fill="#059669" text-anchor="start">SCL</text>
<text x="250" y="312" font-family="DejaVu Sans, Arial" font-size="10" font-weight="600" fill="#059669" text-anchor="start">SDA</text>
<rect x="40" y="358" width="200" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="50" y="378" font-family="DejaVu Sans, Arial" font-size="13" font-weight="700" fill="#1a1d21">GNSS receiver</text><text x="50" y="396" font-family="DejaVu Sans, Arial" font-size="11" fill="#6b7280">u-blox, UBX binary</text><text x="50" y="410" font-family="DejaVu Sans, Arial" font-size="11" fill="#6b7280">9600 then 57600 baud</text>
<path d="M 240 384 L 310 384 L 310 303 L 470 303" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 240 402 L 295 402 L 295 328 L 470 328" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="250" y="378" font-family="DejaVu Sans, Arial" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">RX</text>
<text x="250" y="416" font-family="DejaVu Sans, Arial" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">TX</text>
<rect x="40" y="444" width="200" height="48" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="50" y="464" font-family="DejaVu Sans, Arial" font-size="13" font-weight="700" fill="#1a1d21">Telemetry radio 433 MHz</text><text x="50" y="482" font-family="DejaVu Sans, Arial" font-size="11" fill="#6b7280">Serial in, bit-banged 1 byte/loop</text>
<path d="M 240 468 L 280 468 L 280 358 L 470 358" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="40" y="516" width="260" height="100" rx="6" fill="#f8fafc" stroke="#dc2626" stroke-width="1.5"/><text x="50" y="536" font-family="DejaVu Sans, Arial" font-size="13" font-weight="700" fill="#1a1d21">Battery sense  10k / 1k divider</text><text x="50" y="554" font-family="DejaVu Sans, Arial" font-size="11" fill="#6b7280">3-cell LiPo, 11.1 V nominal</text><text x="50" y="568" font-family="DejaVu Sans, Arial" font-size="11" fill="#6b7280">Divider ratio 1:11 -&gt; 36.3 V full scale</text><text x="50" y="582" font-family="DejaVu Sans, Arial" font-size="11" fill="#6b7280">Firmware divides the count by 112.81,</text><text x="50" y="596" font-family="DejaVu Sans, Arial" font-size="11" fill="#6b7280">and 4095 / (3.3 V x 11) = 112.8. Confirmed.</text>
<path d="M 300 548 L 400 548 L 400 388 L 470 388" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="800" y="200" width="320" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="810" y="218" font-family="DejaVu Sans, Arial" font-size="12" font-weight="700" fill="#1a1d21" text-anchor="start">Electronic speed controllers</text>
<path d="M 710 218 L 800 236" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="812" y="240" font-family="DejaVu Sans, Arial" font-size="10" font-weight="400" fill="#1a1d21" text-anchor="start">ESC 1  front right</text>
<text x="990" y="240" font-family="DejaVu Sans, Arial" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">CCW</text>
<text x="1035" y="240" font-family="DejaVu Sans, Arial" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">1000-2000 us</text>
<path d="M 710 243 L 800 261" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="812" y="265" font-family="DejaVu Sans, Arial" font-size="10" font-weight="400" fill="#1a1d21" text-anchor="start">ESC 2  rear right</text>
<text x="990" y="265" font-family="DejaVu Sans, Arial" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">CW</text>
<text x="1035" y="265" font-family="DejaVu Sans, Arial" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">1000-2000 us</text>
<path d="M 710 268 L 800 286" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="812" y="290" font-family="DejaVu Sans, Arial" font-size="10" font-weight="400" fill="#1a1d21" text-anchor="start">ESC 3  rear left</text>
<text x="990" y="290" font-family="DejaVu Sans, Arial" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">CCW</text>
<text x="1035" y="290" font-family="DejaVu Sans, Arial" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">1000-2000 us</text>
<path d="M 710 293 L 800 311" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="812" y="315" font-family="DejaVu Sans, Arial" font-size="10" font-weight="400" fill="#1a1d21" text-anchor="start">ESC 4  front left</text>
<text x="990" y="315" font-family="DejaVu Sans, Arial" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">CW</text>
<text x="1035" y="315" font-family="DejaVu Sans, Arial" font-size="9" font-weight="400" fill="#6b7280" text-anchor="start">1000-2000 us</text>
<rect x="800" y="333" width="320" height="74" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="810" y="353" font-family="DejaVu Sans, Arial" font-size="13" font-weight="700" fill="#1a1d21">Motor rotation</text><text x="810" y="371" font-family="DejaVu Sans, Arial" font-size="11" fill="#6b7280">Diagonal pairs spin the same way. Swap any two of the</text><text x="810" y="385" font-family="DejaVu Sans, Arial" font-size="11" fill="#6b7280">three motor wires to reverse a direction.</text>
<rect x="800" y="423" width="320" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="810" y="443" font-family="DejaVu Sans, Arial" font-size="13" font-weight="700" fill="#1a1d21">Indicator LEDs  100 ohm series</text><text x="810" y="461" font-family="DejaVu Sans, Arial" font-size="11" fill="#6b7280">PB3 green: flight mode.  PB4 red: error.</text><text x="810" y="475" font-family="DejaVu Sans, Arial" font-size="11" fill="#6b7280">PC13 on-board: GPS fix (inverted).</text>
<path d="M 710 333 L 770 333 L 770 448 L 800 448" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/>
<path d="M 710 358 L 770 358 L 770 448 L 800 448" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/>
<path d="M 710 383 L 770 383 L 770 448 L 800 448" fill="none" stroke="#6b7280" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="28" y1="636" x2="1152" y2="636" stroke="#cbd5e1" stroke-width="1"/>
<text x="28" y="658" font-family="DejaVu Sans, Arial" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">Power: ESCs feed the battery rail. Do not connect the +5 V BEC wire of more than one ESC. The MS5611 runs from 3.3 V, not 5 V.</text>
<text x="28" y="676" font-family="DejaVu Sans, Arial" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">Loop rate 250 Hz. ESC pulses are generated by TIM4 in PWM mode; the receiver PPM stream is decoded by TIM2 input capture.</text>
</svg>