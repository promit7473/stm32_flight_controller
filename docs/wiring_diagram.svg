<text x="590" y="162" font-family="DejaVu Sans, Arial" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">72 MHz Cortex-M3, no FPU</text>
<text x="590" y="178" font-family="DejaVu Sans, Arial" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">3.3 V logic</text>
