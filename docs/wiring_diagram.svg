<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="690" viewBox="0 0 1180 690">
<rect width="1180" height="690" fill="#ffffff"/>
<text x="28" y="34" font-family="DejaVu Sans, Arial" font-size="19" font-weight="700" fill="#1a1d21" text-anchor="start">Quadcopter flight controller — wiring</text>
<text x="28" y="54" font-family="DejaVu Sans, Arial" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Connections derived from the firmware: timer channels, serial ports, I2C bus and the battery scaling constant.</text>
